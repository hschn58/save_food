[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "food_inventory"
version = "0.1.0"
description = "Grocery checklist that feeds your digital pantry, so food stops going to waste"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[tool.hatch.build.targets.wheel]
packages = ["src/food_inventory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
