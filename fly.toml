# Fly.io config. After `fly launch` adjust the app name if taken.
app = "save-food"
primary_region = "ord"

[build]

[mounts]
  source = "save_food_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
